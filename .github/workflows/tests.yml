name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + test extras)
        run: pip install -e ".[test]"
      # Qdrant-marked tests self-skip when qdrant-client isn't installed, so the
      # core suite runs with no external services.
      - name: Run characterization suite
        run: pytest
